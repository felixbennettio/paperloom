[package]
name = "paperloom-ocr"
description = "Text read from pictures: Windows' own recognizer, or Tesseract on Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true

# Windows' own text recognition.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }
