# Google Cloud Build: the Linux and Android apps, and the plugin compatibility
# run. Free tier: 2,500 build-minutes a month on the default e2-standard-2
# machine, so leave the machine type alone. Which service runs what:
# docs/ci.md; the steps are scripts/ci/run.sh, shared with the other services.
#
# Triggers (region us-east1, both pointing at this file; nothing scheduled):
#   - paperloom-manual: Run by hand on any branch; the apps are kept in
#     gs://${_ARTIFACT_BUCKET}/<short sha>/ for 14 days
#   - paperloom-release: tag v*; the same, plus the files added to the tag's
#     GitHub release
#
# Secret Manager secrets: ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, GITHUB_RELEASE_TOKEN (all must exist).
#
# The steps run one after another on the same 2-vCPU machine; images are the
# CircleCI ones (cimg/*), which run as user circleci rather than root, so the
# first step makes the checkout writable for any user.
timeout: 10800s
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
substitutions:
  _ARTIFACT_BUCKET: paperloom-ci-artifacts
steps:
  - id: workspace
    name: ubuntu:24.04
    entrypoint: bash
    args: ["-c", "chmod -R a+rwX /workspace"]

  - id: linux-app
    name: cimg/rust:1.99.1-node
    entrypoint: bash
    env:
      - HOME=/home/circleci
      - RELEASE_TAG=$TAG_NAME
      - GITHUB_REPOSITORY=$REPO_FULL_NAME
    secretEnv: [GITHUB_RELEASE_TOKEN]
    args: ["-c", "scripts/ci/run.sh linux-app && mkdir -p out && mv dist out/linux"]

  - id: android-app
    name: cimg/android:2026.08.1-ndk
    entrypoint: bash
    env:
      - HOME=/home/circleci
      - RELEASE_TAG=$TAG_NAME
      - GITHUB_REPOSITORY=$REPO_FULL_NAME
    secretEnv: [GITHUB_RELEASE_TOKEN, ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS]
    args: ["-c", "scripts/ci/run.sh android-app && mkdir -p out && mv dist out/android"]

  - id: plugins
    name: cimg/node:24.22.0
    entrypoint: bash
    env:
      - HOME=/home/circleci
    args: ["-c", "scripts/ci/run.sh plugins"]

artifacts:
  objects:
    location: gs://${_ARTIFACT_BUCKET}/$SHORT_SHA/
    paths: ["out/linux/*", "out/android/*"]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GITHUB_RELEASE_TOKEN/versions/latest
      env: GITHUB_RELEASE_TOKEN
    - versionName: projects/$PROJECT_ID/secrets/ANDROID_KEYSTORE_B64/versions/latest
      env: ANDROID_KEYSTORE_B64
    - versionName: projects/$PROJECT_ID/secrets/ANDROID_KEYSTORE_PASSWORD/versions/latest
      env: ANDROID_KEYSTORE_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/ANDROID_KEY_ALIAS/versions/latest
      env: ANDROID_KEY_ALIAS
