# cargo-deny for the apps' Rust dependencies (the root workspace: the core,
# the Tauri app and its crates; the sync service has its own workspace).
# Paperloom is closed source, so copyleft that would reach its own code
# (GPL, AGPL, LGPL) is not allowed; MPL-2.0 is, file by file, as it keeps to
# the MPL files themselves. scripts/ci/run.sh core runs all four checks
# (see docs/ci.md); a new advisory fails it until it is fixed or listed
# below with a reason.

[graph]
# Every platform the apps ship on.
all-features = false

[advisories]
version = 2
# Unmaintained crates the apps use directly fail; ones deep in Tauri's and
# GTK's trees are listed in the report.
unmaintained = "workspace"
yanked = "warn"
# Each with why it is accepted for now; remove it when the fix lands.
ignore = [
  # quick-xml 0.38 through hayagriva's CSL parser (citationberg 0.7.0, the
  # latest, has no release on quick-xml 0.41 yet): slow or memory-hungry
  # parsing of a hostile CSL style file, which comes from the CSL repository
  # or the person's own files.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg 0.7.0; no fixed release; CSL style files only" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg 0.7.0; no fixed release; CSL style files only" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published (publish = false).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
