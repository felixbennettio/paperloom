[workspace]
resolver = "3"
members = [
    "core/crates/model",
    "core/crates/store",
    "core/crates/http",
    "core/crates/account",
    "core/crates/metadata",
    "core/crates/citation",
    "core/crates/formats",
    "core/crates/search",
    "core/crates/capture",
    "core/crates/vault",
    "core/crates/fulltext",
    "core/crates/ai",
    "core/crates/sync-proto",
    "core/crates/sync",
    "core/crates/core",
    "core/crates/uniffi-bindgen",
    "app/src-tauri",
    "app/src-tauri/ocr",
    "app/src-tauri/plugins/share",
]
# The sync service is its own workspace: its dependencies (axum, sqlx,
# OpenDAL) stay out of the apps' lockfile.
exclude = ["server"]
# `cargo build` / `cargo test` without `-p` only touch the shared core; the
# Tauri app needs its web UI built first and is built by its own CI jobs.
default-members = [
    "core/crates/model",
    "core/crates/store",
    "core/crates/http",
    "core/crates/account",
    "core/crates/metadata",
    "core/crates/citation",
    "core/crates/formats",
    "core/crates/search",
    "core/crates/vault",
    "core/crates/fulltext",
    "core/crates/ai",
    "core/crates/sync-proto",
    "core/crates/sync",
    "core/crates/core",
    "app/src-tauri/ocr",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
paperloom-model = { path = "core/crates/model" }
paperloom-store = { path = "core/crates/store" }
paperloom-account = { path = "core/crates/account" }
paperloom-http = { path = "core/crates/http" }
paperloom-metadata = { path = "core/crates/metadata" }
paperloom-citation = { path = "core/crates/citation" }
paperloom-formats = { path = "core/crates/formats" }
paperloom-search = { path = "core/crates/search" }
paperloom-capture = { path = "core/crates/capture" }
paperloom-vault = { path = "core/crates/vault" }
paperloom-fulltext = { path = "core/crates/fulltext" }
paperloom-ai = { path = "core/crates/ai" }
paperloom-sync-proto = { path = "core/crates/sync-proto" }
paperloom-sync = { path = "core/crates/sync" }
paperloom-core = { path = "core/crates/core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.29"
uuid = { version = "1", features = ["v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
